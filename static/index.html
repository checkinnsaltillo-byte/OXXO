<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Directorio RME México</title>
<style>
:root{--verde:#1f4e46;--verde2:#2f7a6c;--tinta:#1c2422;--gris:#66736f;--linea:#dfe5e2;--fondo:#f4f6f4;--papel:#fff;--acento:#e8a33d;--suave:#eaf2ef}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--tinta);background:var(--fondo)}
header{background:var(--verde);color:#fff;padding:14px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:30}
header h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.1px}
header .sub{font-size:12px;opacity:.8;margin-top:2px}
header .esp{flex:1;min-width:10px}
.btn{border:1px solid var(--linea);background:var(--papel);color:var(--tinta);border-radius:8px;padding:8px 13px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--verde2)}
.btn.pri{background:var(--acento);border-color:var(--acento);color:#2a1c00;font-size:15px;padding:10px 18px}
.btn.pri:hover{filter:brightness(1.06)}
.btn.pri[disabled]{opacity:.65;cursor:default;filter:none}
.btn.claro{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
#avance{background:#173b35;color:#fff;padding:9px 20px;display:none;font-size:13px;position:sticky;top:0;z-index:29}
#avance .barra{height:6px;background:rgba(255,255,255,.18);border-radius:4px;margin-top:6px;overflow:hidden}
#avance .barra i{display:block;height:100%;width:0;background:var(--acento);transition:width .5s}
#avance.error{background:#8f2d22}#avance.ok{background:#2f7a6c}
main{padding:16px 20px 60px;max-width:1700px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--papel);border:1px solid var(--linea);border-radius:10px;padding:11px 14px}
.kpi b{display:block;font-size:24px;font-weight:650;color:var(--verde)}
.kpi span{font-size:12px;color:var(--gris)}
.filtros{background:var(--papel);border:1px solid var(--linea);border-radius:10px;padding:11px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filtros input[type=search]{flex:1 1 230px;min-width:180px;border:1px solid var(--linea);border-radius:8px;padding:8px 11px;font:inherit}
.ms{position:relative}
.ms>button{max-width:230px;overflow:hidden;text-overflow:ellipsis}
.ms>button.on,.chipf.on{background:var(--suave);border-color:var(--verde2);color:var(--verde)}
.ms .panel{display:none;position:absolute;top:calc(100% + 4px);left:0;background:var(--papel);border:1px solid var(--linea);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:6px;min-width:270px;max-height:340px;overflow:auto;z-index:20}
.ms.abierto .panel{display:block}
.op{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:6px;cursor:pointer;user-select:none}
.op:hover{background:var(--fondo)}
.op .n{margin-left:auto;color:var(--gris);font-size:12px}
.pal{width:18px;height:18px;border:1.5px solid #9aa7a3;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;line-height:1;color:#fff;flex:none}
.sel>.pal,.on>.pal{background:var(--verde2);border-color:var(--verde2)}
.sel>.pal::after,.on>.pal::after{content:"✓"}
.chipf{font-weight:500}
.pestanas{display:flex;gap:4px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.pestanas .tab{border:0;background:transparent;padding:8px 14px;border-radius:8px;font:inherit;font-weight:600;color:var(--gris);cursor:pointer}
.pestanas .tab.on{background:var(--verde);color:#fff}
.pestanas .cuenta{margin-left:auto;color:var(--gris);font-size:13px}
.caja{background:var(--papel);border:1px solid var(--linea);border-radius:10px;overflow:auto;max-height:calc(100vh - 150px)}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--linea);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:#eef2f0;font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:#44524e;white-space:nowrap;z-index:5}
th.ord{cursor:pointer}th.ord:hover{color:var(--verde)}
#tabla td{max-width:300px}
#tabla tbody tr{cursor:pointer}#tabla tbody tr:hover{background:#f7faf8}
.tag{display:inline-block;background:var(--suave);color:var(--verde);border-radius:5px;padding:1px 7px;margin:1px 3px 1px 0;font-size:12px;white-space:nowrap}
.tag.r{background:#f3efe4;color:#6a5417}
.est{font-size:12px;font-weight:600;border-radius:20px;padding:2px 9px;white-space:nowrap}
.est.Nuevo{background:#dff3e3;color:#1c6b33}.est.Actualizado{background:#e3ecfb;color:#234f9c}.est.Sin{background:#eceeed;color:#59625f}.est.resp{background:#fbe6e2;color:#9b3023}.est.duda{background:#fdf1d6;color:#8a5a00}
.cf{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.cf b{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:26px;border-radius:7px;font-size:13.5px;color:#fff;background:#8a9591}
.cf span{font-size:12px;color:var(--gris)}
.cf.a b{background:#1c8a4a}.cf.m b{background:#c58a12}.cf.b b{background:#c0562a}.cf.x b{background:#8f1d1d}.cf.s b{background:#a9b3b0}
.alerta{color:#a3341f;font-size:12px;font-weight:600;margin-top:3px;white-space:nowrap}
.perfil{background:var(--papel);border:1px solid var(--linea);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.perfil h4{margin:0 0 8px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.perfil table{width:100%;border-collapse:collapse}
.perfil td,.perfil th{padding:6px 8px;border-bottom:1px solid var(--linea);font-size:13px;position:static;background:none;text-transform:none;letter-spacing:0;max-width:none!important;white-space:normal}
.perfil th{color:var(--gris);font-weight:600;font-size:12px}
.perfil tr:last-child td{border-bottom:0}
.perfil .barra{display:inline-block;width:70px;height:7px;border-radius:4px;background:#e3e9e6;vertical-align:middle;margin-right:7px;overflow:hidden}
.perfil .barra i{display:block;height:100%;background:var(--verde2)}
.perfil .al{margin:8px 0 0;padding:8px 10px;background:#fdecea;border-radius:8px;color:#8f2d22;font-size:13px}
.perfil ul{margin:6px 0 0 18px;padding:0;font-size:13px}
.tenue{color:var(--gris)}.nowrap{white-space:nowrap}
a{color:#17605a}
.pie{display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:10px 2px;color:var(--gris);font-size:13px}
.piv-ctl{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.piv-ctl label{font-size:13px;color:var(--gris)}
select{font:inherit;border:1px solid var(--linea);border-radius:8px;padding:7px 9px;background:var(--papel)}
#pivote td,#pivote th{text-align:right;white-space:nowrap}
#pivote td:first-child,#pivote th:first-child{text-align:left;position:sticky;left:0;background:var(--papel);font-weight:600}
#pivote th:first-child{background:#eef2f0;z-index:6}
#pivote tr.tot td{font-weight:700;background:#eef2f0;position:sticky;bottom:0}
#pivote th.v{writing-mode:vertical-rl;transform:rotate(180deg);text-align:left;vertical-align:bottom;white-space:nowrap;text-transform:none;font-size:12.5px;padding:10px 6px}
.vacio{padding:50px 20px;text-align:center;color:var(--gris)}
#tabla tbody tr.sel>td{background:#dff0ea;box-shadow:inset 0 2px 0 var(--verde2)}
#tabla tbody tr.sel>td:first-child{box-shadow:inset 4px 0 0 var(--verde2),inset 0 2px 0 var(--verde2)}
#tabla tbody tr.det{cursor:default}
#tabla tbody tr.det>td{max-width:none;padding:0;background:#f3f9f6;border-bottom:2px solid var(--verde2)}
#tabla tbody tr.det:hover{background:none}
.det .in{position:sticky;left:0;width:var(--cajaW,100%);padding:14px 18px 16px 22px;box-shadow:inset 4px 0 0 var(--verde2)}
.det .tit{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.det .tit b{font-size:16px}.det .tit .btn{padding:5px 10px;font-size:13px}.det .tit .der{margin-left:auto}
.det .campos{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px 24px}
.det .campos div{min-width:0;word-break:break-word}
.det .campos span{display:block;color:var(--gris);font-size:12px}
.det .campos .ancho{grid-column:1/-1}
.rme-pin.sel{background:#0f766e;color:#fff;box-shadow:0 0 0 3px rgba(232,163,61,.95),0 6px 18px rgba(15,118,110,.45);z-index:6}
.rme-cluster.sel{box-shadow:0 0 0 3px rgba(15,118,110,.95),0 6px 18px rgba(249,115,22,.35)}
.pestanas .tab.mapa{border:1px solid var(--linea);background:var(--papel);color:var(--tinta);margin-left:6px}
.pestanas .tab.mapa.on{background:var(--verde2);border-color:var(--verde2);color:#fff}
#mapa{position:fixed;right:0;top:0;bottom:0;width:44vw;background:var(--papel);border-left:1px solid var(--linea);box-shadow:-8px 0 30px rgba(0,0,0,.12);z-index:28;display:none;flex-direction:column}
body.mapa-on #mapa{display:flex}
body.mapa-on main{margin-right:44vw;max-width:none}
#mapa .cab{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--linea);font-weight:650}
#mapa .cab span{font-weight:400;color:var(--gris);font-size:13px}
#mapa .cab button{margin-left:auto}
#mapa-lienzo{flex:1;min-height:0;background:#e8ecea}
.rme-pin{position:absolute;transform:translate(-50%,-100%);background:rgba(255,255,255,.94);color:#0f172a;padding:5px 11px;border-radius:99px;font-size:12px;font-weight:800;box-shadow:0 4px 12px rgba(15,23,42,.25),0 1px 3px rgba(15,23,42,.15);cursor:pointer;white-space:nowrap;backdrop-filter:blur(4px);transition:all .15s;letter-spacing:-.01em;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.rme-pin:hover{background:#0f766e;color:#fff;transform:translate(-50%,-100%) scale(1.08);box-shadow:0 6px 18px rgba(15,118,110,.4);z-index:5}
.rme-cluster{position:absolute;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,#f97316,#f59e0b);color:#fff;font-size:11px;font-weight:800;padding:6px 12px 6px 6px;border-radius:999px;box-shadow:0 6px 18px rgba(249,115,22,.35),0 2px 6px rgba(15,23,42,.15);cursor:pointer;white-space:nowrap;transition:transform .15s}
.rme-cluster:hover{transform:translate(-50%,-50%) scale(1.08);box-shadow:0 10px 26px rgba(249,115,22,.5)}
.rme-cluster b{background:rgba(255,255,255,.28);border-radius:999px;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;padding:0 6px}
.rme-cluster span{font-size:10px;opacity:.95;letter-spacing:.02em;text-transform:uppercase}
.leaflet-popup-content-wrapper{border-radius:14px;box-shadow:0 20px 60px -8px rgba(0,0,0,.4)}
.leaflet-popup-content{margin:13px 15px;font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-width:220px}
.mcard b{font-size:14.5px;display:block;margin-bottom:2px}
.mcard .l{margin-top:5px}
.mcard .acc{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.mcard .acc button{border:0;background:var(--verde);color:#fff;border-radius:7px;padding:6px 11px;font:inherit;font-weight:600;cursor:pointer}
.mcard .item{padding:5px 0;border-bottom:1px solid var(--linea);cursor:pointer}.mcard .item:hover{color:var(--verde2)}
@media(max-width:900px){#mapa{width:100vw;z-index:45;top:0!important}body.mapa-on main{margin-right:0}}
@media(max-width:640px){header{padding:12px}main{padding:12px 10px 50px}.caja{max-height:none}}
</style>
</head>
<body>
<header>
  <div>
    <h1>Directorio de empresas · Residuos de manejo especial · México</h1>
    <div class="sub" id="sub">Cargando…</div>
  </div>
  <div class="esp"></div>
  <a class="btn claro" href="/descargar.xlsx">⬇ Descargar Excel</a>
  <button class="btn pri" id="btnRun">▶ Ejecutar extracción</button>
</header>
<div id="avance"><span id="avTxt"></span><div class="barra"><i id="avBar"></i></div></div>
<main>
  <div class="kpis" id="kpis"></div>
  <div class="filtros" id="filtros">
    <input type="search" id="q" placeholder="Buscar nombre, razón social, RFC, correo, teléfono, dirección…">
  </div>
  <div class="pestanas">
    <button class="tab on" data-v="tabla">Tabla</button>
    <button class="tab" data-v="pivote">Tabla dinámica</button>
    <button class="tab mapa" id="btnMapa" type="button">🗺️ Ver Mapa</button>
    <span class="cuenta" id="cuenta"></span>
  </div>
  <section id="v-tabla">
    <div class="caja"><table id="tabla"><thead></thead><tbody></tbody></table><div class="vacio" id="vacio" style="display:none">Sin empresas con esos filtros.</div></div>
    <div class="pie"><button class="btn" id="ant">‹ Anterior</button><span id="pag"></span><button class="btn" id="sig">Siguiente ›</button></div>
  </section>
  <section id="v-pivote" style="display:none">
    <div class="piv-ctl">
      <label>Filas <select id="pf"></select></label>
      <label>Columnas <select id="pc"></select></label>
      <span class="tenue">Cuenta de empresas (según los filtros activos). Una empresa con varios valores cuenta en cada uno.</span>
    </div>
    <div class="caja"><table id="pivote"></table></div>
  </section>
</main>
<aside id="mapa">
  <div class="cab">Mapa <span id="mapaCuenta"></span><button class="btn" type="button" id="mapaCerrar">Cerrar ✕</button></div>
  <div id="mapa-lienzo"></div>
</aside>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const lista = v => Array.isArray(v) ? v : (v ? [v] : []);
const urlOk = u => /^https?:\/\//i.test(u || '') ? u : '';

const CONF_CLS = {'Alta': 'a', 'Media': 'm', 'Baja': 'b', 'No confiable': 'x', 'Sin información suficiente': 's'};
const REPSE_CLS = {'Registrado vigente': 'Nuevo', 'Registro vencido': 'resp', 'Sin registro activo': 'resp', 'Coincidencia dudosa': 'duda'};
const REPSE_ORD = {'Registrado vigente': 1, 'Registro vencido': 2, 'Sin registro activo': 3, 'Coincidencia dudosa': 4, 'No encontrado': 5};
const MOTORES = {places: 'Google Maps', gemini: 'Google web (Gemini)', cse: 'Google web (API)', importar: 'Google web (captura)'};
let EMP = [], CORRIDA = {}, VISTA = [];
const F = {confianza: new Set(), sat: new Set(), semarnat: new Set(), q: '', estados: new Set(), sede: new Set(), servicios: new Set(), residuos: new Set(), repse: new Set(), fuente: new Set(), estatus: new Set(), flags: new Set()};
const FILTROS = [['confianza', 'Confianza'], ['estados', 'Estado (búsqueda)'], ['sede', 'Estado sede'], ['servicios', 'Servicio'], ['residuos', 'Tipo de residuo'], ['repse', 'REPSE'], ['sat', 'SAT'], ['semarnat', 'SEMARNAT'], ['fuente', 'Fuente'], ['estatus', 'Estatus']];
const ORD = {k: 'confianza', dir: -1};
let PAGINA = 0; const POR_PAG = 50;

const DIMS = {
  estados: {t: 'Estado (búsqueda)', g: r => lista(r.estados_busqueda)},
  sede: {t: 'Estado sede', g: r => [r.estado_sede || '(sin detectar)']},
  servicios: {t: 'Servicio', g: r => lista(r.servicios)},
  residuos: {t: 'Tipo de residuo', g: r => lista(r.residuos)},
  aut: {t: 'Autorización / certificación', g: r => lista(r.autorizaciones).length ? lista(r.autorizaciones) : ['(ninguna)']},
  estatus: {t: 'Estatus del mes', g: r => [r.estatus_mes || '(sin estatus)']},
  confianza: {t: 'Nivel de confianza', g: r => [r.confianza_nivel || 'Sin calificar']},
  sat: {t: 'SAT (69 / 69-B)', g: r => [r.sat_estatus || 'Sin cruzar']},
  semarnat: {t: 'SEMARNAT', g: r => [r.semarnat_estatus || 'Sin cruzar']},
  semrubro: {t: 'SEMARNAT: rubro autorizado', g: r => lista(r.semarnat_rubros).length ? lista(r.semarnat_rubros) : ['(ninguno)']},
  denue: {t: 'DENUE', g: r => [r.denue_estatus || 'Sin cruzar']},
  tamano: {t: 'Personal ocupado (DENUE)', g: r => [r.denue_personal || '(sin dato)']},
  repse: {t: 'REPSE', g: r => [r.repse_estatus || 'Sin validar']},
  fuente: {t: 'Fuente', g: r => String(r.fuente || '').split(', ').filter(Boolean).map(m => MOTORES[m] || m)},
};
const FLAGS = {tel: ['Con teléfono', r => lista(r.telefonos).length], mail: ['Con correo', r => lista(r.correos).length],
  rs: ['Con razón social', r => r.razon_social], rfc: ['Con RFC', r => r.rfc], repse: ['Con REPSE vigente', r => r.repse_estatus === 'Registrado vigente'], alerta: ['Con alertas', r => lista(r.confianza_alertas).length], dir: ['Con dirección', r => r.direccion]};

const COLS = [
  {k: 'nombre', t: 'Empresa', h: r => `<b>${esc(r.nombre)}</b>${r.razon_social ? `<div class="tenue">${esc(r.razon_social)}</div>` : ''}`, o: r => norm(r.nombre)},
  {k: 'confianza', t: 'Confianza', h: r => r.confianza_nivel ? `<div class="cf ${CONF_CLS[r.confianza_nivel] || ''}"><b>${r.confianza_nivel === 'Sin información suficiente' ? '–' : esc(r.confianza)}</b><span>${esc(r.confianza_nivel)}</span></div>${lista(r.confianza_alertas).length ? `<div class="alerta" title="${esc(lista(r.confianza_alertas).join(' · '))}">⚠ ${lista(r.confianza_alertas).length} alerta${lista(r.confianza_alertas).length > 1 ? 's' : ''}</div>` : ''}` : '', o: r => (r.confianza_nivel === 'Sin información suficiente' ? -1 : r.confianza_nivel === 'No confiable' ? -2 : (r.confianza || 0))},
  {k: 'rfc', t: 'RFC', h: r => esc(r.rfc), o: r => r.rfc || '~'},
  {k: 'repse_estatus', t: 'REPSE', h: r => r.repse_estatus ? `<span class="est rp ${REPSE_CLS[r.repse_estatus] || 'Sin'}">${esc(r.repse_estatus)}</span>${r.repse_folio ? `<div class="tenue nowrap">Folio ${esc(r.repse_folio)}</div>` : ''}` : '', o: r => (REPSE_ORD[r.repse_estatus] || 9) + String(r.repse_vigencia || '')},
  {k: 'estados_busqueda', t: 'Estado', h: r => esc(lista(r.estados_busqueda).join(', ')) + (r.estado_sede ? `<div class="tenue">Sede: ${esc(r.estado_sede)}</div>` : ''), o: r => norm(lista(r.estados_busqueda)[0] || '~')},
  {k: 'telefonos', t: 'Teléfonos', h: r => lista(r.telefonos).slice(0, 3).map(t => `<div class="nowrap">${esc(t)}</div>`).join(''), o: r => lista(r.telefonos)[0] || '~'},
  {k: 'correos', t: 'Correos', h: r => lista(r.correos).slice(0, 2).map(c => `<div>${esc(c)}</div>`).join(''), o: r => lista(r.correos)[0] || '~'},
  {k: 'sitio', t: 'Sitio web', h: r => urlOk(r.sitio) ? `<a href="${esc(r.sitio)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(r.sitio.replace(/^https?:\/\//, ''))}</a>` : '', o: r => r.sitio || '~'},
  {k: 'servicios', t: 'Servicios', h: r => lista(r.servicios).map(s => `<span class="tag">${esc(s)}</span>`).join(''), o: r => -lista(r.servicios).length},
  {k: 'residuos', t: 'Tipos de residuos', h: r => lista(r.residuos).map(s => `<span class="tag r">${esc(s)}</span>`).join(''), o: r => -lista(r.residuos).length},
  {k: 'direccion', t: 'Dirección', h: r => esc(r.direccion), o: r => norm(r.direccion) || '~'},
  {k: 'relevancia', t: 'Relev.', h: r => esc(r.relevancia), o: r => r.relevancia || 0},
  {k: 'estatus_mes', t: 'Estatus', h: r => r.estatus_mes ? `<span class="est ${r.estatus_mes === 'Sin respuesta' ? 'resp' : esc(r.estatus_mes.split(' ')[0])}">${esc(r.estatus_mes)}</span>` : '', o: r => r.estatus_mes || '~'},
  {k: 'ultima_verificacion', t: 'Verificado', h: r => `<span class="nowrap">${esc(r.ultima_verificacion)}</span>`, o: r => r.ultima_verificacion || ''},
];

// ── Filtros ──
function pasa(r) {
  for (const [k] of FILTROS)
    if (F[k].size && !DIMS[k].g(r).some(v => F[k].has(v))) return false;
  for (const f of F.flags) if (!FLAGS[f][1](r)) return false;
  if (F.q) {
    if (!r._txt) r._txt = norm([r.nombre, r.razon_social, r.rfc, r.direccion, r.sitio, r.descripcion, lista(r.correos).join(' '), lista(r.telefonos).join(' '), lista(r.telefonos).join('').replace(/\s/g, ''), lista(r.estados_busqueda).join(' ')].join(' '));
    if (!F.q.split(/\s+/).every(p => r._txt.includes(p))) return false;
  }
  return true;
}
function armarFiltros() {
  const cont = $('#filtros');
  cont.querySelectorAll('.ms,.chipf,.limpiar').forEach(e => e.remove());
  for (const [k, titulo] of FILTROS) {
    const cnt = new Map();
    EMP.forEach(r => DIMS[k].g(r).forEach(v => cnt.set(v, (cnt.get(v) || 0) + 1)));
    const vals = [...cnt.keys()].sort((a, b) => (k === 'estados' || k === 'sede') ? a.localeCompare(b, 'es') : cnt.get(b) - cnt.get(a));
    [...F[k]].forEach(v => cnt.has(v) || F[k].delete(v));
    const ms = document.createElement('div'); ms.className = 'ms';
    ms.innerHTML = `<button class="btn" type="button"></button><div class="panel">${vals.map(v => `<div class="op${F[k].has(v) ? ' sel' : ''}" data-v="${esc(v)}"><span class="pal"></span><span>${esc(v)}</span><span class="n">${cnt.get(v)}</span></div>`).join('')}</div>`;
    const boton = ms.querySelector('button');
    const rotular = () => { boton.textContent = F[k].size ? `${titulo}: ${F[k].size === 1 ? [...F[k]][0] : F[k].size + ' seleccionados'} ▾` : `${titulo} ▾`; boton.classList.toggle('on', F[k].size > 0); };
    rotular(); ms._rotular = rotular;
    boton.onclick = e => { e.stopPropagation(); document.querySelectorAll('.ms.abierto').forEach(o => o !== ms && o.classList.remove('abierto')); ms.classList.toggle('abierto'); };
    ms.querySelector('.panel').onclick = e => {  // marcar no cierra ni redibuja el menú
      e.stopPropagation(); const op = e.target.closest('.op'); if (!op) return;
      const v = op.dataset.v; F[k].has(v) ? F[k].delete(v) : F[k].add(v);
      op.classList.toggle('sel', F[k].has(v)); rotular(); aplicar();
    };
    cont.appendChild(ms);
  }
  for (const [f, [titulo]] of Object.entries(FLAGS)) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'btn chipf' + (F.flags.has(f) ? ' on' : '');
    b.innerHTML = `<span class="pal"></span>${titulo}`;
    b.onclick = () => { F.flags.has(f) ? F.flags.delete(f) : F.flags.add(f); b.classList.toggle('on', F.flags.has(f)); aplicar(); };
    cont.appendChild(b);
  }
  const l = document.createElement('button'); l.type = 'button'; l.className = 'btn limpiar'; l.textContent = 'Limpiar filtros';
  l.onclick = () => { F.q = ''; $('#q').value = ''; [...FILTROS.map(f => f[0]), 'flags'].forEach(k => F[k].clear()); armarFiltros(); aplicar(); };
  cont.appendChild(l);
}

}

// Perfil de confianza: puntos por bloque con su fuente y fecha; distingue «verificado» de «no se pudo verificar».
function perfil(r) {

    `<span class="tenue" style="font-weight:400">${esc(r.confianza_verificadas)} de 4 fuentes oficiales verificadas · calculado el ${esc(r.confianza_fecha)}</span></h4>` +

    (sem.length ? `<ul>${sem.map(a => `<li>SEMARNAT ${esc(a.rubro)} — autorización ${esc(a.autorizacion)}, vigencia ${esc(a.vigencia || 's/d')} · ${esc(a.empresa)} (${esc(a.municipio)}, ${esc(a.estado)})${a.residuos ? ' · ' + esc(a.residuos) : ''}</li>`).join('')}</ul>` : '') + '</div>';

// Selección compartida entre la tabla y el mapa.
let SEL = null;
function seleccionar(clave, origen) {
  SEL = clave || null;
  const r = SEL && EMP.find(x => x.clave === SEL);

// ── Tabla dinámica ──
function pintarPivote() {
  const df = DIMS[$('#pf').value], kc = $('#pc').value, dc = kc ? DIMS[kc] : null;
  const m = new Map(), totC = new Map(), totF = new Map();
  VISTA.forEach(r => df.g(r).forEach(f => {
    totF.set(f, (totF.get(f) || 0) + 1);
    (dc ? dc.g(r) : ['Empresas']).forEach(c => { m.set(f + '\u0001' + c, (m.get(f + '\u0001' + c) || 0) + 1); });
  }));
  if (dc) VISTA.forEach(r => dc.g(r).forEach(c => totC.set(c, (totC.get(c) || 0) + 1)));
  const filas = [...totF.keys()].sort((a, b) => totF.get(b) - totF.get(a) || a.localeCompare(b, 'es'));
  const cols = dc ? [...totC.keys()].sort((a, b) => totC.get(b) - totC.get(a)) : ['Empresas'];
  const max = Math.max(1, ...m.values());
  const celda = n => n ? `<td style="background:rgba(47,122,108,${(0.08 + 0.55 * n / max).toFixed(2)})">${n}</td>` : '<td class="tenue">·</td>';
  let h = `<thead><tr><th>${esc(df.t)}</th>` + cols.map(c => `<th class="${dc && cols.length > 6 ? 'v' : ''}">${esc(c)}</th>`).join('') + (dc ? '<th>Empresas</th>' : '') + '</tr></thead><tbody>';
  h += filas.map(f => `<tr><td>${esc(f)}</td>` + cols.map(c => celda(m.get(f + '\u0001' + c))).join('') + (dc ? `<td><b>${totF.get(f)}</b></td>` : '') + '</tr>').join('');
  h += `<tr class="tot"><td>Total (empresas únicas)</td>` + cols.map(c => `<td>${dc ? totC.get(c) : VISTA.length}</td>`).join('') + (dc ? `<td>${VISTA.length}</td>` : '') + '</tr></tbody>';
  $('#pivote').innerHTML = filas.length ? h : '<tbody><tr><td class="vacio">Sin datos con esos filtros.</td></tr></tbody>';
}

$('#pc').innerHTML = '<option value="">(ninguna)</option>' + Object.entries(DIMS).map(([k, d]) => `<option value="${k}">${d.t}</option>`).join('');

// ── Mapa (panel lateral). Misma mecánica que el mapa de la landing check-inn.mx:
//    Leaflet bajo demanda, pines tipo píldora, racimos por cercanía en pantalla y tarjeta resumen sobre el pin. ──
const MAPA = {on: false, map: null, capas: [], pts: []};
function mapaLeaflet(cb) {
  if (window.L) return cb();
  const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(css);
  const js = document.createElement('script'); js.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'; js.onload = cb; document.head.appendChild(js);
}
function mapaColocar() { const h = document.querySelector('header').getBoundingClientRect(); $('#mapa').style.top = Math.max(0, h.bottom) + 'px'; }
function mapaEnfocar(r) {
  const map = MAPA.map; if (!map) return;
  if (!r || !r.lat || !r.lng) { map.closePopup(); $('#mapaCuenta').textContent = r ? `«${r.nombre}» no tiene ubicación en el mapa` : ''; return mapaMarcadores(); }
  map.setView([r.lat, r.lng], Math.max(map.getZoom(), 15), {animate: true});
  mapaMarcadores();
  L.popup({offset: [0, -26], maxWidth: 300, autoPan: false}).setLatLng([r.lat, r.lng]).setContent(mapaTarjeta(r)).openOn(map);
}
function mapaAlternar(abrir, enfocar) {
  MAPA.on = abrir === undefined ? !MAPA.on : abrir;
  document.body.classList.toggle('mapa-on', MAPA.on); $('#btnMapa').classList.toggle('on', MAPA.on);
  $('#btnMapa').textContent = MAPA.on ? '🗺️ Ocultar Mapa' : '🗺️ Ver Mapa';
  if (!MAPA.on) return;
  mapaColocar();
  mapaLeaflet(() => {
    if (!MAPA.map) {
      MAPA.map = L.map('mapa-lienzo').setView([23.6, -102.5], 5);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, attribution: '© OpenStreetMap'}).addTo(MAPA.map);
      MAPA.map.on('zoomend moveend', mapaMarcadores);
    }
    setTimeout(() => {
      MAPA.map.invalidateSize(); mapaPintar(true);
      const r = enfocar || (SEL && EMP.find(x => x.clave === SEL)); if (r && r.lat) mapaEnfocar(r);
    }, 80);
  });
}
function mapaPintar(encuadrar) {
  MAPA.pts = VISTA.filter(r => r.lat && r.lng);
  $('#mapaCuenta').textContent = `${MAPA.pts.length} de ${VISTA.length} empresas con ubicación`;
  MAPA.map.closePopup();
  const elegido = SEL && MAPA.pts.find(r => r.clave === SEL);
  if (elegido) return mapaEnfocar(elegido);
  if (encuadrar && MAPA.pts.length) MAPA.map.fitBounds(MAPA.pts.map(r => [r.lat, r.lng]), {padding: [40, 40], maxZoom: 14});
  mapaMarcadores();
}
function mapaMarcadores() {
  const map = MAPA.map; if (!map) return;
  MAPA.capas.forEach(m => map.removeLayer(m)); MAPA.capas = [];
  const caja = map.getBounds().pad(0.2), CELDA = 58, grupos = new Map();
  MAPA.pts.forEach(r => {  // racimos: puntos que caen en la misma celda de pantalla
    if (!caja.contains([r.lat, r.lng])) return;
    const px = map.latLngToLayerPoint([r.lat, r.lng]), k = Math.floor(px.x / CELDA) + ':' + Math.floor(px.y / CELDA);
    (grupos.get(k) || grupos.set(k, []).get(k)).push(r);
  });
  grupos.forEach(g => {
    if (g.length === 1) {
      const r = g[0], icon = L.divIcon({className: '', html: `<div class="rme-pin${r.clave === SEL ? ' sel' : ''}">${esc(r.nombre)}</div>`, iconSize: [0, 0]});
      const m = L.marker([r.lat, r.lng], {icon, zIndexOffset: r.clave === SEL ? 1000 : 0}).addTo(map);
      m.on('click', () => { seleccionar(r.clave, 'mapa'); mapaEnfocar(r); });
      MAPA.capas.push(m);
    } else {
      const lat = g.reduce((s, r) => s + r.lat, 0) / g.length, lng = g.reduce((s, r) => s + r.lng, 0) / g.length;
      const icon = L.divIcon({className: '', html: `<div class="rme-cluster${g.some(r => r.clave === SEL) ? ' sel' : ''}"><b>${g.length}</b><span>empresas</span></div>`, iconSize: [0, 0]});
      const m = L.marker([lat, lng], {icon, zIndexOffset: 500}).addTo(map);
      m.on('click', () => {
        const b = L.latLngBounds(g.map(r => [r.lat, r.lng]));
        if (map.getZoom() >= 18 || b.getNorthEast().equals(b.getSouthWest()))
          L.popup({maxWidth: 300}).setLatLng([lat, lng]).setContent(`<div class="mcard"><b>${g.length} empresas en este punto</b>` + g.slice(0, 12).map(r => `<div class="item" data-ficha="${esc(r.clave)}">${esc(r.nombre)}</div>`).join('') + '</div>').openOn(map);
        else map.fitBounds(b, {padding: [70, 70], maxZoom: Math.min(18, map.getZoom() + 4)});
      });
      MAPA.capas.push(m);
    }
  });
}
function mapaTarjeta(r) {
  const tel = lista(r.telefonos)[0], serv = lista(r.servicios).slice(0, 4);
  return `<div class="mcard"><b>${esc(r.nombre)}</b><div class="tenue">${esc(r.direccion || r.estado_sede || '')}</div>` +
    (tel ? `<div class="l">☎ ${esc(tel)}</div>` : '') + (lista(r.correos)[0] ? `<div class="l">✉ ${esc(lista(r.correos)[0])}</div>` : '') +
    (serv.length ? `<div class="l">${serv.map(s => `<span class="tag">${esc(s)}</span>`).join('')}</div>` : '') +

    (urlOk(r.sitio) ? `<a href="${esc(r.sitio)}" target="_blank" rel="noopener">Sitio web</a>` : '') +
    (urlOk(r.maps) ? `<a href="${esc(r.maps)}" target="_blank" rel="noopener">Google Maps</a>` : '') + '</div></div>';
}
$('#btnMapa').onclick = () => mapaAlternar();
$('#mapaCerrar').onclick = () => mapaAlternar(false);
$('#mapa-lienzo').addEventListener('click', e => { const b = e.target.closest('[data-ficha]'); if (!b) return; const r = EMP.find(x => x.clave === b.dataset.ficha); seleccionar(b.dataset.ficha, 'mapa'); mapaEnfocar(r); });
window.addEventListener('resize', () => { if (MAPA.on) { mapaColocar(); MAPA.map && MAPA.map.invalidateSize(); } });
window.addEventListener('scroll', () => { if (MAPA.on) mapaColocar(); }, {passive: true});

// ── Datos y extracción ──
const fecha = iso => iso ? new Date(iso).toLocaleString('es-MX', {dateStyle: 'medium', timeStyle: 'short'}) : '';
function pintarKpis() {
  const n = f => EMP.filter(f).length, est = new Set(); EMP.forEach(r => lista(r.estados_busqueda).forEach(e => est.add(e)));
  const k = [[EMP.length, 'Empresas'], [est.size + ' / 32', 'Estados con empresas'], [n(r => lista(r.telefonos).length), 'Con teléfono'], [n(r => lista(r.correos).length), 'Con correo'],
    [n(r => r.razon_social), 'Con razón social'], [n(r => r.rfc), 'Con RFC'], [n(r => r.repse_estatus === 'Registrado vigente'), 'Con REPSE vigente'], [n(r => r.confianza_nivel === 'Alta'), 'Confianza alta'], [n(r => lista(r.confianza_alertas).length), 'Con alertas'], [n(r => r.estatus_mes === 'Nuevo'), 'Nuevas en la última corrida']];
  $('#kpis').innerHTML = k.map(([v, t]) => `<div class="kpi"><b>${v}</b><span>${t}</span></div>`).join('');
  $('#sub').textContent = CORRIDA.fecha ? `Última extracción: ${fecha(CORRIDA.fecha)} · Fuentes: ${String(CORRIDA.motor || '').split(', ').map(m => MOTORES[m] || m).join(' + ')} · ${CORRIDA.consultas} consultas, ${CORRIDA.candidatos} sitios revisados` : 'Aún no se ha ejecutado ninguna extracción.';
}
async function cargar() {
  const d = await (await fetch('/api/datos', {cache: 'no-store'})).json();
  EMP = d.empresas || []; CORRIDA = d.corrida || {};
  pintarKpis(); armarFiltros(); aplicar();
  return d.estado || {};
}
let reloj = null;
function pintarEstado(e) {
  const av = $('#avance'), vivo = e.estado === 'corriendo' || e.estado === 'en cola';
  $('#btnRun').disabled = vivo; $('#btnRun').textContent = vivo ? '⏳ Extrayendo…' : '▶ Ejecutar extracción';
  av.className = e.estado === 'error' ? 'error' : e.estado === 'terminado' ? 'ok' : '';
  if (vivo) {
    const pct = e.total ? Math.round(100 * e.hecho / e.total) : 0;
    av.style.display = 'block'; $('#avBar').parentElement.style.display = '';
    $('#avTxt').textContent = `${e.etapa || 'Iniciando'}${e.total ? ` · ${e.hecho} de ${e.total} (${pct}%)` : '…'}`;
    $('#avBar').style.width = (e.total ? pct : 4) + '%';
  }
  return vivo;
}
async function vigilar() {
  clearInterval(reloj);
  reloj = setInterval(async () => {
    let e; try { e = await (await fetch('/api/estado', {cache: 'no-store'})).json(); } catch (_) { return; }
    if (pintarEstado(e)) return;
    clearInterval(reloj);
    const av = $('#avance'); av.style.display = 'block'; $('#avBar').parentElement.style.display = 'none';
    if (e.estado === 'terminado') {
      await cargar(); const p = e.por_estatus || {};
      $('#avTxt').textContent = `Extracción terminada: ${e.empresas} empresas · ${p.Nuevo || 0} nuevas, ${p.Actualizado || 0} actualizadas, ${p['Sin cambios'] || 0} sin cambios, ${p['Sin respuesta'] || 0} sin respuesta.`;
      setTimeout(() => { av.style.display = 'none'; }, 15000);
    } else $('#avTxt').textContent = 'La extracción falló: ' + (e.error || 'error desconocido');
  }, 3000);
}
$('#btnRun').onclick = async () => {
  $('#btnRun').disabled = true;
  const r = await fetch('/api/ejecutar', {method: 'POST'}); const d = await r.json().catch(() => ({}));
  if (!r.ok && r.status !== 409) { $('#avance').className = 'error'; $('#avance').style.display = 'block'; $('#avBar').parentElement.style.display = 'none'; $('#avTxt').textContent = d.motivo || 'No se pudo iniciar la extracción.'; $('#btnRun').disabled = false; return; }
  pintarEstado(d.estado || {estado: 'en cola'}); vigilar();
};
cargar().then(e => { if (pintarEstado(e)) vigilar(); }).catch(() => { $('#sub').textContent = 'No se pudieron cargar los datos.'; });
</script>
</body>
